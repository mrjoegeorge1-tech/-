<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ahoy! Marine-Style Error-Based SRS</title>
  <style>
    :root {
      --primary-red: #8b0000;
      --accent-crimson: #c41e3a;
      --deep-navy: #0a1128;
      --gold-accent: #d4af37;
      --gold-hover: #f3e5ab;
      --card-bg: rgba(15, 23, 42, 0.85);
      --text-light: #f8fafc;
      --border-gold: 2px solid #d4af37;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--deep-navy);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: var(--text-light);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .app-container {
      width: 100%;
      max-width: 650px;
      background: var(--card-bg);
      border: var(--border-gold);
      border-radius: 16px;
      box-shadow: 0 0 25px rgba(212, 175, 55, 0.3);
      backdrop-filter: blur(8px);
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      position: relative;
    }

    .header {
      text-align: center;
      border-bottom: 2px dashed var(--gold-accent);
      padding-bottom: 16px;
    }

    .header h1 {
      font-size: 1.8rem;
      color: var(--gold-accent);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
    }

    .sub-header {
      font-size: 0.85rem;
      color: #cbd5e1;
      margin-top: 4px;
    }

    .mode-selector {
      display: flex;
      gap: 10px;
      background: rgba(0, 0, 0, 0.4);
      padding: 6px;
      border-radius: 8px;
      border: 1px solid rgba(212, 175, 55, 0.4);
    }

    .mode-btn {
      flex: 1;
      padding: 8px 12px;
      background: transparent;
      border: none;
      color: #94a3b8;
      font-weight: bold;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s;
    }

    .mode-btn.active {
      background: var(--accent-crimson);
      color: white;
      box-shadow: 0 2px 8px rgba(196, 30, 58, 0.5);
    }

    .prompt-box {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid var(--gold-accent);
      border-radius: 12px;
      padding: 25px 20px;
      text-align: center;
      position: relative;
    }

    .prompt-title {
      font-size: 0.8rem;
      color: var(--gold-accent);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .prompt-text {
      font-size: 1.8rem;
      font-weight: bold;
      word-break: break-word;
    }

    .card-meta {
      margin-top: 10px;
      font-size: 0.8rem;
      color: #fb7185;
      font-weight: bold;
    }

    .input-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      border: 2px solid var(--gold-accent);
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      font-size: 1.1rem;
      outline: none;
      text-align: center;
    }

    input[type="text"]:focus {
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.6);
    }

    .submit-btn {
      padding: 12px;
      background: var(--accent-crimson);
      color: white;
      border: 1px solid var(--gold-accent);
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: background 0.2s;
    }

    .submit-btn:hover {
      background: #a0182e;
    }

    .feedback-box {
      padding: 16px;
      border-radius: 8px;
      text-align: center;
      display: none;
      flex-direction: column;
      gap: 12px;
    }

    .feedback-box.correct {
      background: rgba(34, 197, 94, 0.2);
      border: 1px solid #22c55e;
      color: #4ade80;
    }

    .feedback-box.incorrect {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid #ef4444;
      color: #fca5a5;
    }

    .next-btn {
      padding: 10px;
      background: var(--gold-accent);
      color: var(--deep-navy);
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
      text-transform: uppercase;
    }

    .next-btn:hover {
      background: var(--gold-hover);
    }

    .settings-panel {
      border-top: 1px solid rgba(212, 175, 55, 0.3);
      padding-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .settings-title {
      font-size: 0.9rem;
      color: var(--gold-accent);
      font-weight: bold;
    }

    .bg-options {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .bg-input {
      flex: 1;
      min-width: 200px;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid var(--gold-accent);
      background: rgba(0, 0, 0, 0.5);
      color: #fff;
      font-size: 0.85rem;
    }

    .file-label {
      background: rgba(212, 175, 55, 0.2);
      border: 1px solid var(--gold-accent);
      color: var(--gold-accent);
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: bold;
    }

    .stats-footer {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="header">
      <h1>🏴‍☠️ Houshou Marine Japanese Deck 🏴‍☠️</h1>
      <div class="sub-header">Ahoy! Repeat items based on mistake frequency</div>
    </div>

    <div class="mode-selector">
      <button class="mode-btn active" id="btn-mode-jp-en" onclick="setMode('jp-en')">Japanese → English</button>
      <button class="mode-btn" id="btn-mode-en-jp" onclick="setMode('en-jp')">English → Japanese</button>
    </div>

    <div class="prompt-box">
      <div class="prompt-title" id="prompt-title">Japanese Prompt</div>
      <div class="prompt-text" id="prompt-text">Loading...</div>
      <div class="card-meta" id="card-meta">Times Wrong: 0</div>
    </div>

    <div class="input-section" id="input-section">
      <input type="text" id="user-answer" placeholder="Type your answer here..." autocomplete="off" />
      <button class="submit-btn" id="submit-btn" onclick="checkAnswer()">Submit Answer</button>
    </div>

    <div class="feedback-box" id="feedback-box">
      <div id="feedback-text"></div>
      <div id="correct-answer-display" style="font-weight: bold;"></div>
      <button class="next-btn" onclick="proceedToNextCard()">Next Card ➔</button>
    </div>

    <div class="stats-footer">
      <span id="due-count">Due Cards: 0</span>
      <span id="total-count">Total Deck: 77</span>
    </div>

    <div class="settings-panel">
      <div class="settings-title">⚓ Custom Ship Background</div>
      <div class="bg-options">
        <input type="text" class="bg-input" id="bg-url-input" placeholder="Paste image URL here..." />
        <button class="file-label" onclick="applyUrlBg()">Apply URL</button>
        <label class="file-label">
          Upload Image
          <input type="file" id="bg-file-input" accept="image/*" style="display: none;" onchange="applyFileBg(event)" />
        </label>
        <button class="file-label" style="background: rgba(239, 68, 68, 0.2); border-color: #ef4444; color: #fca5a5;" onclick="clearBg()">Reset</button>
      </div>
    </div>
  </div>

      { id: 49, jp: "Sou desu. / そうです。", en: "That's right.", answers: ["that's right"] },
      { id: 50, jp: "Sumimasen, chotto. / すみません、ちょっと。", en: "Sorry, it is a little (inconvenient for me).", answers: ["sorry, it is a little", "sorry", "sorry, it is a little (inconvenient for me)."] },
      { id: 51, jp: "Sumimasen. / すみません。", en: "Sorry; excuse me.", answers: ["sorry", "excuse me", "sorry; excuse me."] },
      { id: 52, jp: "watashi / わたし / 私", en: "I", answers: ["i", "me"] },
      { id: 53, jp: "いち / ichi / 一", en: "one", answers: ["one", "1"] },
      { id: 54, jp: "いちじ / ichiji / 一時", en: "1 o'clock", answers: ["1 o'clock", "1 o clock", "one o'clock"] },
      { id: 55, jp: "いまなんじですか。/ Ima nanji desu ka. / 今何時ですか。", en: "What time is it now?", answers: ["what time is it now?", "what time is it"] },

      { id: 59, jp: "くじ / kuji / 九時", en: "9 o'clock", answers: ["9 o'clock", "nine o'clock", "9 o clock"] },

      { id: 61, jp: "ごごしちじ / gogo shichiji / 午後七時", en: "7 p.m.", answers: ["7 p.m.", "7 pm", "7p.m."] },
      { id: 62, jp: "ごじ / goji / 五時", en: "5 o'clock", answers: ["5 o'clock", "five o'clock", "5 o clock"] },

      { id: 92, jp: "ろくじ / rokuji / 六時", en: "6 o'clock", answers: ["6 o'clock", "six o'clock", "6 o clock"] },
      { id: 93, jp: "わたしの / watashi no / 私の", en: "my", answers: ["my"] }

    let currentMode = 'jp-en';
    let srsData = {};
    let currentCard = null;

    window.onload = function() {
      const savedBg = localStorage.getItem('marine_app_bg');
      if (savedBg) {
        document.body.style.backgroundImage = `url('${savedBg}')`;
      }

      const savedSrs = localStorage.getItem('marine_error_srs_data');
      if (savedSrs) {
        srsData = JSON.parse(savedSrs);
      } else {
        initSrsData();
      }

      loadNextCard();

      document.getElementById('user-answer').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
          if (document.getElementById('input-section').style.display !== 'none') {
            checkAnswer();
          } else {
            proceedToNextCard();
          }
        }
      });
    };

    function initSrsData() {
      vocabularyList.forEach(item => {
        srsData[item.id] = {
          dueDate: Date.now(),
          wrongCount: 0
        };
      });
      saveSrsData();
    }

    function saveSrsData() {
      localStorage.setItem('marine_error_srs_data', JSON.stringify(srsData));
    }

    function setMode(mode) {
      currentMode = mode;
      document.getElementById('btn-mode-jp-en').classList.toggle('active', mode === 'jp-en');
      document.getElementById('btn-mode-en-jp').classList.toggle('active', mode === 'en-jp');
      resetCardView();
      loadNextCard();
    }

    function loadNextCard() {
      const now = Date.now();
      let dueCards = vocabularyList.filter(item => (srsData[item.id]?.dueDate || 0) <= now);
      
      if (dueCards.length === 0) {
        dueCards = [...vocabularyList].sort((a, b) => srsData[a.id].dueDate - srsData[b.id].dueDate);
      }

      // Prioritize cards with higher wrong counts
      dueCards.sort((a, b) => (srsData[b.id]?.wrongCount || 0) - (srsData[a.id]?.wrongCount || 0));

      // Pick randomly from the top 5 most problematic/due cards
      const topPool = dueCards.slice(0, Math.min(5, dueCards.length));
      currentCard = topPool[Math.floor(Math.random() * topPool.length)];

      const promptTitle = document.getElementById('prompt-title');
      const promptText = document.getElementById('prompt-text');
      const cardMeta = document.getElementById('card-meta');

      if (currentMode === 'jp-en') {
        promptTitle.textContent = "Japanese Prompt (Type English)";
        promptText.textContent = currentCard.jp;
      } else {
        promptTitle.textContent = "English Prompt (Type Japanese / Romaji)";
        promptText.textContent = currentCard.en;
      }

      const wrongCount = srsData[currentCard.id]?.wrongCount || 0;
      cardMeta.textContent = `Times Wrong: ${wrongCount}`;

      document.getElementById('due-count').textContent = `Due Cards: ${dueCards.length}`;
      document.getElementById('total-count').textContent = `Total Deck: ${vocabularyList.length}`;
    }

    function normalizeText(text) {
      return text.toLowerCase()
        .replace(/[.,\/#!$%\^&\*;:{}=\-_`~()?]/g, "")
        .replace(/\s+/g, " ")
        .trim();
    }

    function checkAnswer() {
      const inputVal = normalizeText(document.getElementById('user-answer').value);
      if (!inputVal) return;

      let isCorrect = false;
      let expectedDisplay = "";

      if (currentMode === 'jp-en') {
        expectedDisplay = currentCard.en;
        isCorrect = currentCard.answers.some(ans => normalizeText(ans) === inputVal);
      } else {
        expectedDisplay = currentCard.jp;
        const validJpAnswers = currentCard.jp.split('/').map(s => normalizeText(s));
        isCorrect = validJpAnswers.some(ans => ans === inputVal);
      }

      const feedbackBox = document.getElementById('feedback-box');
      const feedbackText = document.getElementById('feedback-text');
      const correctAnswerDisplay = document.getElementById('correct-answer-display');

      document.getElementById('input-section').style.display = 'none';
      feedbackBox.style.display = 'flex';

      const cardState = srsData[currentCard.id] || { wrongCount: 0, dueDate: 0 };
      const now = Date.now();
      const minuteInMs = 60 * 1000;
      const hourInMs = 60 * minuteInMs;

      if (isCorrect) {
        feedbackBox.className = "feedback-box correct";
        feedbackText.textContent = "Ahoy! Correct Answer!";
        correctAnswerDisplay.textContent = `Target: ${expectedDisplay}`;

        // Calculate next review interval based on error history:
        // More mistakes = shorter delay before seeing it again.
        // Few/no mistakes = longer delay before seeing it again.
        let delay;
        if (cardState.wrongCount === 0) {
          delay = 24 * hourInMs; // 1 day
        } else if (cardState.wrongCount === 1) {
          delay = 4 * hourInMs;  // 4 hours
        } else if (cardState.wrongCount <= 3) {
          delay = 30 * minuteInMs; // 30 minutes
        } else {
          delay = 5 * minuteInMs;  // 5 minutes
        }

        cardState.dueDate = now + delay;
      } else {
        feedbackBox.className = "feedback-box incorrect";
        feedbackText.textContent = "Incorrect!";
        correctAnswerDisplay.textContent = `Correct Answer: ${expectedDisplay}`;

        // Increment total error counter
        cardState.wrongCount += 1;
        // Schedule review immediately in 1 minute
        cardState.dueDate = now + (1 * minuteInMs);
      }

      srsData[currentCard.id] = cardState;
      saveSrsData();
    }

    function proceedToNextCard() {
      resetCardView();
      loadNextCard();
    }

    function resetCardView() {
      document.getElementById('user-answer').value = '';
      document.getElementById('input-section').style.display = 'flex';
      document.getElementById('feedback-box').style.display = 'none';
      document.getElementById('user-answer').focus();
    }

    function applyUrlBg() {
      const url = document.getElementById('bg-url-input').value.trim();
      if (url) {
        document.body.style.backgroundImage = `url('${url}')`;
        localStorage.setItem('marine_app_bg', url);
      }
    }

    function applyFileBg(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const bgDataUrl = e.target.result;
          document.body.style.backgroundImage = `url('${bgDataUrl}')`;
          localStorage.setItem('marine_app_bg', bgDataUrl);
        };
        reader.readAsDataURL(file);
      }
    }

    function clearBg() {
      document.body.style.backgroundImage = 'none';
      localStorage.removeItem('marine_app_bg');
      document.getElementById('bg-url-input').value = '';
    }
  </script>
</body>
</html>
